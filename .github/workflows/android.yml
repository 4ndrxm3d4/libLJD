name: Android AArch64 Shared Library

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK r27c
        shell: bash
        run: |
          set -e
          cd /tmp
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          rm ndk.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r27c" >> $GITHUB_ENV
          echo "/tmp/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Verify NDK
        shell: bash
        run: |
          ls -la $ANDROID_NDK_HOME
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ --version

      - name: Configure CMake (AArch64)
        shell: bash
        run: |
          set -e
          mkdir -p build-android
          cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLJD_BUILD_TESTS=OFF

      - name: Build libljd.so
        shell: bash
        run: |
          cd build-android
          cmake --build . --config Release -j$(nproc)

      - name: Upload AArch64 .so
        uses: actions/upload-artifact@v4
        with:
          name: libljd-aarch64
          path: build-android/libljd.so
          retention-days: 14
